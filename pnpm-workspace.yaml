packages:
  - 'packages/*'
  - 'scripts/*'

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

verifyDepsBeforeRun: false

catalog:
  '@noble/ciphers': 1.3.0
  '@noble/hashes': 1.8.0
  '@noble/curves': 1.7.0
  '@scure/base': 1.2.5
  '@scure/starknet': 1.1.0
  'starknet': 9.4.2

allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
